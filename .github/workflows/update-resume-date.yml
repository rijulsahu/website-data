name: Update Resume Date

on:
  push:
    branches:
      - qa
    paths:
      - 'assets/Rijul_Sahu.pdf'

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: qa

      - name: Update last-updated date
        run: |
          MONTH=$(date +'%B %Y')
          sed -Ei 's/(<!-- LAST_UPDATED_DATE -->[[:space:]]*)[[:alpha:]]+ [0-9]{4}/\1'"$MONTH"'/' index.html

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update resume date"
          file_pattern: index.html
